name: Update search index

on:
  push:
    paths:
      - "index.html"
      - "html/**"
      - "data/events.json"
      - "data/news.json"
      - "scripts/build-search-index.mjs"

permissions:
  contents: write

concurrency:
  group: search-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-search-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild search index
        run: npm run build:search

      - name: Commit updated search index
        run: |
          if git diff --quiet -- data/search-index.json; then
            echo "Search index is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search-index.json
          git commit -m "chore: update search index"
          git push origin "HEAD:${GITHUB_REF_NAME}"
